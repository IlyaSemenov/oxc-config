name: Test

on:
  push:
    branches: ["**"]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.7

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Typecheck package
        run: bun run types

      - name: Test package
        run: bun run test
