glob_matcher: doublestar
pre-commit:
  piped: true
  commands:
    oxlint:
      priority: 1
      glob: "**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,vue}"
      run: ./node_modules/.bin/oxlint --fix {staged_files}
      stage_fixed: true
    oxfmt:
      priority: 2
      glob: "**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,md,yaml,yml,vue,css,scss,html}"
      run: ./node_modules/.bin/oxfmt {staged_files}
      stage_fixed: true
